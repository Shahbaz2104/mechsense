<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MechSense — industrial machine health intelligence: sensor trends, anomaly detection, and maintenance workflow for reliability engineers."
    />
    <title>MechSense — Machine Health Intelligence</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong palette.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : true
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* storage unavailable — keep the dark default declared on <html> */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
